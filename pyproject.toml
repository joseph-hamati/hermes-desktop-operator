[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hermes-desktop-operator"
version = "0.1.0"
description = "Local Windows desktop automation daemon with strict action schemas and optional Ollama planning."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Joseph" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "structlog>=24.2",
  "python-dotenv>=1.0",
  "pyautogui>=0.9.54; platform_system == 'Windows'",
  "pywinauto>=0.6.8; platform_system == 'Windows'",
  "keyboard>=0.13.5; platform_system == 'Windows'",
  "pyperclip>=1.9.0; platform_system == 'Windows'",
  "pillow>=10.4; platform_system == 'Windows'"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11"
]

[project.scripts]
hermes-desktop-operator = "desktop_operator.main:main"
hermes-submit = "desktop_operator.hermes.client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_operator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "windows_integration: tests that control real Windows UI and are skipped outside Windows"
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = [".venv", ".uv-cache", ".uv-python", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["desktop_operator"]
